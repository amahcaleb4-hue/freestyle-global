    <main class="main">


        <!-- TOPBAR -->

        <header class="topbar">


            <button class="menu-button" id="menuButton">

                <i class="fa-solid fa-bars"></i>

            </button>


            <div class="topbar-title">


                <span>

                    STORE MANAGEMENT

                </span>


                <h1>

                    Products

                </h1>


            </div>


            <div class="admin-area">


                <button class="notification">


                    <a style="color: inherit;" href="/admin/messages">
                        <i class="fa-regular ">
                            <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-bell-icon lucide-bell">
                                <path d="M10.268 21a2 2 0 0 0 3.464 0" />
                                <path
                                    d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326" />
                            </svg>
                        </i>
                    </a>

                    <small class="messageCount">



                    </small>


                </button>


                <div class="avatar">

                    A

                </div>


                <div class="admin-name">


                    <strong>

                        Admin

                    </strong>


                    <span>

                        Store Manager

                    </span>


                </div>


            </div>


        </header>


        <!-- =========================
             PRODUCTS PAGE
        ========================== -->

        <section class="products-page">


            <!-- PAGE HEADER -->

            <div class="products-header">


                <div>


                    <span class="page-label">

                        STORE INVENTORY

                    </span>


                    <h1>

                        Manage Products

                    </h1>


                    <p>

                        View, edit and manage all products
                        in your store.

                    </p>


                </div>


                <a href="/admin/add" class="add-product-btn">


                    <i class="fa-solid fa-plus"></i>


                    Add Product


                </a>


            </div>


            <!-- SEARCH AND FILTER -->

            <div class="product-controls">


                <div class="search-box">


                    <i class="fa-solid fa-magnifying-glass"></i>


                    <input type="text" id="searchInput" placeholder="Search products...">

                </div>


                <select id="categoryFilter">


                    <option value="">

                        All Categories

                    </option>


                    <option value="lotion">

                        Lotion

                    </option>


                    <option value="shower gel">

                        Shower gel

                    </option>


                    <option value="soap">

                        Soap

                    </option>


                    <option value="serum">

                        Serum

                    </option>

                    <option value="oil">
                        Oil
                    </option>

                    <option value="perfumes">
                        Perfumes
                    </option>

                    <option value="scrub">
                        Scrub
                    </option>

                    <option value="uv">
                        UV
                    </option>
                </select>


            </div>


            <!-- PRODUCTS CONTAINER -->

            <div class="products-container">


                <!-- CONTAINER HEADER -->

                <div class="products-container-header">


                    <div>


                        <span>

                            ALL PRODUCTS

                        </span>


                        <h2 id="productCount">

                            0 Products

                        </h2>


                    </div>


                    <button class="sort-btn">


                        <i class="fa-solid fa-sort"></i>


                        Sort


                    </button>


                </div>


                <!-- PRODUCTS GRID -->

                <div class="products-grid" id="productsGrid">


                    <!-- Products will be inserted here by JavaScript -->


                </div>


                <!-- PAGINATION -->
                <div class="pagination">

                    <span id="paginationText">
                        Showing 0 products
                    </span>

                    <div id="paginationButtons">

                    </div>

                </div>

            </div>


        </section>


    </main>


    <!-- MOBILE OVERLAY -->

    <div class="overlay" id="overlay">

    </div>


    <!-- MOBILE MENU SCRIPT -->

    <script>


        const menuButton =

            document.getElementById(

                "menuButton"

            );


        const sidebar =

            document.getElementById(

                "sidebar"

            );


        const overlay =

            document.getElementById(

                "overlay"

            );


        menuButton.addEventListener(

            "click",

            () => {


                sidebar.classList.toggle(

                    "show"

                );


                overlay.classList.toggle(

                    "show"

                );


            }

        );


        overlay.addEventListener(

            "click",

            () => {


                sidebar.classList.remove(

                    "show"

                );


                overlay.classList.remove(

                    "show"

                );


            }

        );


    </script>


    <!-- PRODUCTS JAVASCRIPT -->

    <script src="/admin/js/products.js"></script>
    <script src="/admin/js/notification.js"></script>
    <script src="/admin/js/logout.js"></script>
